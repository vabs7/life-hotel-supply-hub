<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Life Hotel Supply HUB</title>
  <link rel="icon" type="image/png" href="favicon1.png">
  <link rel="stylesheet" href="css/styles.css?v=2.1">
  <!-- Firebase SDK Compat libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      background-image:
        radial-gradient(at 0% 0%, rgba(113, 174, 73, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(113, 174, 73, 0.05) 0px, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 2.75rem 2.25rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      text-align: center;
      box-sizing: border-box;
    }

    .logo-container {
      width: 250px;
      height: 100px;
      margin: 0 auto 1.25rem auto;
      border-radius: 1rem;
      background: #ffffff;
      border: 2px solid var(--primary-light);
      box-shadow: 0 4px 12px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-sizing: border-box;
    }

    .auth-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0.75rem;
    }

    .auth-title {
      color: #0f172a;
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0 0 0.25rem 0;
      letter-spacing: -0.025em;
    }

    .auth-subhead {
      color: #64748b;
      font-size: 0.875rem;
      font-weight: 500;
      margin: 0 0 1.75rem 0;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 0.625rem;
      color: #0f172a;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px var(--primary-glow);
    }

    .btn-login {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      border: none;
      border-radius: 0.625rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--primary-glow);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer-text {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="logo-container">
      <img src="logo.jpg" alt="Life Hotel Supply" class="auth-logo">
    </div>
    <h2 class="auth-title">HUB</h2>
    <p class="auth-subhead">Life Hotel Supply Attendance & HR Portal</p>

    <form id="loginForm" onsubmit="executeLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Email or Username</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="Enter your email or username" required
          autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required
          autocomplete="current-password">
      </div>

      <div id="loginError"
        style="color: #ef4444; font-size: 0.85rem; margin-bottom: 0.85rem; display: none; text-align: left; font-weight: 500;">
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn-login">Sign In</button>
    </form>

    <div class="login-footer-text">
      Copyright © 2009-2026 Life Hotel Supply. <br />All Rights Reserved.
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If user is already authenticated, redirect immediately to dashboard.html
      const existingUser = localStorage.getItem('lhs_current_user');
      if (existingUser) {
        try {
          JSON.parse(existingUser);
          window.location.href = 'dashboard.html';
          return;
        } catch (e) { }
      }

      // Initialize Firebase Services
      if (typeof initFirebaseServices === 'function') {
        try {
          await initFirebaseServices();
        } catch (e) {
          console.warn('Firebase init note:', e);
        }
      }
    });

    async function executeLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('loginUsername').value.trim().toLowerCase();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');

      if (errEl) {
        errEl.style.display = 'none';
        errEl.textContent = '';
      }

      if (!usernameInput) {
        if (errEl) {
          errEl.textContent = 'Please enter your email or username.';
          errEl.style.display = 'block';
        }
        return;
      }

      if (btn) {
        btn.textContent = 'Authenticating...';
        btn.disabled = true;
      }

      let user = null;

      // Query Firestore directly for the single matching user (1 read max)
      if (typeof firebaseDb !== 'undefined' && firebaseDb) {
        try {
          let snap = await firebaseDb.collection('users').where('username', '==', usernameInput).get();
          if (snap.empty) {
            snap = await firebaseDb.collection('users').where('email', '==', usernameInput).get();
          }
          if (!snap.empty) {
            user = snap.docs[0].data();
          }
        } catch (err) {
          console.warn('Firestore direct auth check error:', err);
        }
      }

      // Fallback check against local storage cache if network is offline
      if (!user) {
        try {
          const cachedUsersStr = localStorage.getItem('lhs_users');
          if (cachedUsersStr) {
            const cachedUsers = JSON.parse(cachedUsersStr);
            user = cachedUsers.find(u =>
              (u.username && u.username.toLowerCase() === usernameInput) ||
              (u.email && u.email.toLowerCase() === usernameInput)
            );
          }
        } catch (err) { }
      }

      if (!user) {
        if (errEl) {
          errEl.textContent = 'Invalid email/username or account not found.';
          errEl.style.display = 'block';
        }
        if (btn) {
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
        return;
      }

      // Block ex-employees
      if (user.offboard_date) {
        if (errEl) {
          errEl.textContent = 'Access Denied: Offboarded ex-employees cannot log into the system.';
          errEl.style.display = 'block';
        }
        if (btn) {
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
        return;
      }

      // Password Validation
      const expectedPassword = user.password || '123456';
      if (passwordInput !== expectedPassword) {
        if (errEl) {
          errEl.textContent = 'Incorrect password. Please check your password and try again.';
          errEl.style.display = 'block';
        }
        if (btn) {
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
        return;
      }

      // Authenticated successfully: save session and invalidate cache so dashboard fetches correct data scope
      localStorage.setItem('lhs_current_user', JSON.stringify(user));
      localStorage.removeItem('lhs_cache_ts');

      if (btn) btn.textContent = 'Signing in...';

      // Redirect to main dashboard page
      window.location.href = 'dashboard.html';
    }
  </script>
</body>

</html>
